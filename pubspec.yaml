name: ai_cv_analyzer
description: AI CV Analyzer — a futuristic, glassmorphic Flutter app for resume / ATS analysis across Web, Mobile, and Desktop.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Animations
  flutter_animate: ^4.5.0

  # Charts
  fl_chart: ^0.66.2

  # Networking (multipart upload to REST API)
  http: ^1.2.1
  http_parser: ^4.0.2

  # File picking (cross-platform)
  file_picker: ^8.0.0

  # State management
  provider: ^6.1.2

  # Utilities
  google_fonts: ^6.2.1
  percent_indicator: ^4.2.3

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
